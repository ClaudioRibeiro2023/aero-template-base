name: Typecheck (monorepo)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages (workspace discovery)
        run: pnpm -r --if-present run typecheck

      - name: Docs build smoke (apps/docs)
        # apps/docs não expõe script `typecheck` (Docusaurus); garantir que o build
        # estático roda evita drift entre o portal de docs e o resto do monorepo.
        run: pnpm --filter "@template/docs" --if-present run build
